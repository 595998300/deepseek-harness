# Reference nginx configuration for DeepSeek Harness
# Copy this to your nginx instance and adjust as needed.
#
# The dsh container exposes port 3000 (mapped via docker-compose),
# so your nginx can reach it at http://127.0.0.1:3000.

upstream dsh_backend {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    server_name _;

    # ------------------------------------------------------------------
    # 1. Static assets with content hash → long-term cache
    # ------------------------------------------------------------------
    location /assets/ {
        proxy_pass http://dsh_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ------------------------------------------------------------------
    # 2. WebSocket upgrade paths (must be before /api/ catch-all)
    # ------------------------------------------------------------------
    location /api/events.mux {
        proxy_pass http://dsh_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /api/events.host {
        proxy_pass http://dsh_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ------------------------------------------------------------------
    # 3. API RPC + SSE streams (all POST /api/* + session export GET)
    # ------------------------------------------------------------------
    location /api/ {
        proxy_pass http://dsh_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE streaming must not be buffered
        proxy_buffering off;
        proxy_cache off;

        # Long timeout for SSE connections (may stay open for hours)
        proxy_read_timeout 86400s;

        # Accept large request bodies (file uploads, session exports)
        client_max_body_size 50m;
    }

    # ------------------------------------------------------------------
    # 4. SPA routing: fall back to index.html for any unmatched path
    # ------------------------------------------------------------------
    location / {
        proxy_pass http://dsh_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------------
    # 5. Security headers
    # ------------------------------------------------------------------
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";
}